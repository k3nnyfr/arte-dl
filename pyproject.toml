[project]
name = "arte-dl"
version = "0.1.0"
description = "Download whole arte.tv series with yt-dlp into a tidy Series/Season XX/ tree of MKV files"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "yt-dlp>=2025.1.1",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
arte-dl = "arte_dl.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["arte_dl"]
